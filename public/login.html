<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SafeIncident</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-login">
  <main class="login-card">
    <h1>SafeIncident</h1>
    <p class="subtitulo">Gestão de incidentes de segurança da informação</p>

    <form id="form-login" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username">

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">

      <p id="mensagem-erro" class="mensagem-erro" hidden></p>

      <button type="submit" id="btn-entrar" class="btn btn-primario">Entrar</button>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
